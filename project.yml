name: TokyoFlow
options:
  bundleIdPrefix: com.tokyoflow
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"

schemes:
  TokyoFlow:
    build:
      targets:
        TokyoFlow: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TokyoFlowTests

targets:
  TokyoFlow:
    type: application
    platform: iOS
    sources:
      - path: TokyoFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyoflow.app
        INFOPLIST_FILE: TokyoFlow/Info.plist
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RC8QN44S75
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  TokyoFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TokyoFlowTests
    dependencies:
      - target: TokyoFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyoflow.app.tests
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RC8QN44S75
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
