<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技术支持与帮助中心 — TokyoFlow</title>
  <link rel="icon" href="/assets/app_icon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Shippori+Mincho:wght@600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .legal-wrapper { max-width: 820px; margin: 0 auto; padding: 150px 2rem 80px; }
    .legal-wrapper h1 { font-family: var(--font-serif); font-size: 2.6rem; margin-bottom: 0.5rem; color: var(--navy); }
    .legal-wrapper .date-tag { font-family: var(--font-mono); font-size: 0.8rem; color: var(--gold-deep); margin-bottom: 2.5rem; display: block; }
    .legal-card { background: var(--bg-paper-card); border: 1px solid var(--border-gold); border-radius: var(--radius-lg); padding: 2.5rem; margin-bottom: 2rem; box-shadow: var(--shadow-card); }
    .legal-card h2 { font-family: var(--font-serif); font-size: 1.3rem; font-weight: 700; color: var(--navy); margin-bottom: 1rem; }
    .legal-card p { font-family: var(--font-serif); color: var(--ink-sub); font-size: 0.98rem; line-height: 1.75; margin-bottom: 1rem; }
    .legal-card ul { font-family: var(--font-serif); padding-left: 1.5rem; color: var(--ink-sub); font-size: 0.98rem; line-height: 1.75; margin-bottom: 1rem; }
    .legal-card li { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand-mark">
        <img src="/assets/app_icon.jpg" alt="TokyoFlow Icon" class="brand-icon" width="38" height="38">
        <div class="brand-text-group">
          <div class="brand-title">TOKYO<span>FLOW</span></div>
          <span class="brand-kanji">東京・文脈主導の日本語</span>
        </div>
      </a>
      <a href="/" class="btn-nav-primary">← 返回主页</a>
    </div>
  </header>

  <main class="legal-wrapper">
    <h1>技术支持与帮助中心</h1>
    <span class="date-tag">TokyoFlow 用户服务团队</span>

    <div class="legal-card">
      <h2>常见问题与支持</h2>
      <p>如果您在使用 TokyoFlow 过程中遇到任何疑问、学习反馈或技术问题，请随时与我们联系：</p>
      <ul>
        <li><strong>官方支持邮箱：</strong> support@tokyoflow.app</li>
        <li><strong>YouTube 互动专区：</strong> 在 @TokyoFlowJapan 视频评论区留言，我们将定期解答高频语言问题。</li>
        <li><strong>应用反馈：</strong> 在 iOS App 内点击设置 - 反馈与建议即可提交设备日志与问题报告。</li>
      </ul>
    </div>
  </main>
</body>
</html>
